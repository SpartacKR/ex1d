<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex1d</title>
    <link rel="stylesheet" href="styles/style-main.css">
    <link rel="stylesheet" href="styles/style-main-exitf.css">
    <link rel="stylesheet" href="styles/style-music-min.css">
</head>

<body>
    
    <header class="site-header">
        <div class="header-container">

            <div class="header-left">
                <a href="index.html" class="logo" style="font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif; color: #ff003c; font-size: 24px; font-weight: bold; text-decoration: none;">Ex1d</a> 
            </div>

        
            <div class="header-center">
                <input type="text" class="search-input" placeholder="Поиск">
            </div>
       
            <div class="header-right">
                <button class="icon-btn"><img src="uvedomlenie_0uo7j22pii95_32.png" alt="" class="icon-btn-btn1"></button>  
                <div class="header-profile">
                   
                    <img src="avatar.jpg" alt="Аватар" class="header-avatar">
                    <a href="profiles/1/index-profile-spartack.html" class="profile-name" style="font-weight: bold; text-decoration: none;">SpartacK</a>
                </div>
            </div>

        </div>
    </header>

    <main>

        <section class="left_bord_main_plast">
            <div class="left-panel-box">
                <nav class="sidebar-menu">
                    <a href="profiles/1/index-profile-spartack.html" class="menu-item">Профиль</a>
                    <a href="#" class="menu-item">Мессенджер</a>
                    <a href="#" class="menu-item">Музыка</a>
                </nav>
            </div>
        </section>

        <section class="main_bord_main_plast">
            <div class="create-post-box">
                <div class="create-post-upper">
                    <div class="create-post-avatar"></div>
                    <textarea placeholder="Что у вас нового?" class="post-input" rows="1"></textarea>
                </div>

                <div class="post-actions">
                    <button class="attach-btn">📎</button>
                    <button class="publish-btn">Опубликовать</button>
                </div>
            </div>

            <div class="post-card">
   
                <div class="post-header">
                    <div class="post-author-avatar"></div>
                    <div class="post-author-info">
                        <span class="post-author-name">Капибара Разработчик</span>
                        <span class="post-time">10 минут назад</span>
                    </div>
                </div>

    
                <div class="post-content">
                    <p>Первый пост в моей новой социальной сети! Сетка колонок настроена через Grid, багровая неоновая тема работает идеально. Дальше будет только круче. 🔥</p>
                </div>

   
                <div class="post-image-wrap">
   
                    <div class="post-ambient-blur" style="background-image: url('12333.jpg');"></div>
    
    
                    <div class="post-img-cut">
                        <img src="12333.jpg" alt="Пост" class="post-main-img">
                    </div> 
                </div>


  
                <div class="post-footer">
                    <button class="reaction-btn love-btn">
                        <span>❤️</span> 12
                    </button>
                    <button class="reaction-btn comment-btn">
                        <span>💬</span> 4
                    </button>
                </div>
            </div>

        </section>

        <section class="right_bord_main_plast">
    
    
            <div class="music-island-box">
                <div class="music-header">
                    <span class="music-title">Сейчас играет</span>
                    <span class="music-source">Музыка</span>
                </div>

                <div class="track-info">
                    <div class="track-cover"><div class="cover-stub"></div></div>
                    <div class="track-text">
                        <span class="track-name">Cyberpunk Neon</span>
                        <span class="track-artist">Amoled Artist</span>
                    </div>
                </div>

                <div class="player-progress-bar"><div class="progress-fill"></div></div>

                <div class="player-controls">
                    <button class="player-btn">⏮</button>
                    <button class="player-btn play-btn">▶</button>
                    <button class="player-btn">⏭</button>
                </div>
            </div>

   
            <div class="customizable-zone">
                <div class="widget-settings">
                    <h3 class="widget-title">Настройка интерфейса</h3>
    
                    <div class="settings-list">
        
                        <label class="setting-item">
                        <span class="setting-text">Музыкальный плеер</span>
                        <input type="checkbox" checked class="custom-checkbox">
                        </label>

                        <label class="setting-item">
                            <span class="setting-text">Блок «В тренде»</span>
                            <input type="checkbox" class="custom-checkbox">
                        </label>

                        <label class="setting-item">
                            <span class="setting-text">Рекомендации друзей</span>
                            <input type="checkbox" checked class="custom-checkbox">
                        </label>
                    </div>

                    <button class="save-settings-btn">Применить сборку</button>
                </div>

            </div>

        </section>

    </main>

    <footer>
    </footer>

    <script src="js/script-img.js"></script>
</body>
</html>
